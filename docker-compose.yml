services:
  db:
    image: mysql:8.4
    container_name: fichestu-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fichestu_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fichestu-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/fichestu_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      HIBERNATE_DDL_AUTO: validate
    ports:
      - "8080:8080"
    volumes:
      - avatar_uploads:/app/uploads
    develop:
      watch:
        - action: rebuild
          path: .

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: fichestu-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8082:80"

volumes:
  mysql_data:
  avatar_uploads:
