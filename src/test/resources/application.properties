spring.datasource.url=jdbc:h2:mem:fichestu-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=false

app.security.jwt.secret=tests-secret-tests-secret-tests-secret!
app.security.jwt.expiration-seconds=3600
app.email.enabled=false
app.market.reset-zone=Europe/Madrid
app.market.tick-interval-ms=999999999
