spring.application.name=fichestu
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fichestu_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${HIBERNATE_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.connect-retries=30
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.out-of-order=true

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.password-reset.mail-enabled=${PASSWORD_RESET_MAIL_ENABLED:false}
app.password-reset.from=${PASSWORD_RESET_FROM:fichestu.soporte@gmail.com}

app.email.enabled=${EMAIL_NOTIFICATIONS_ENABLED:false}
app.email.from=${EMAIL_NOTIFICATIONS_FROM:fichestu.soporte@gmail.com}

app.resend.api-key=${RESEND_API_KEY:}
app.resend.from=${RESEND_FROM:Fichestu <onboarding@resend.dev>}
app.resend.timeout-seconds=${RESEND_TIMEOUT_SECONDS:15}

app.google-mail-script.url=${GOOGLE_MAIL_SCRIPT_URL:}
app.google-mail-script.secret=${GOOGLE_MAIL_SCRIPT_SECRET:}
app.google-mail-script.timeout-seconds=${GOOGLE_MAIL_SCRIPT_TIMEOUT_SECONDS:15}

app.market.daily-reset-cron=${MARKET_DAILY_RESET_CRON:0 0 0 * * *}
app.market.reset-zone=${MARKET_RESET_ZONE:Europe/Madrid}
app.market.tick-interval-ms=${MARKET_TICK_INTERVAL_MS:300000}

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:10000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:10000}
